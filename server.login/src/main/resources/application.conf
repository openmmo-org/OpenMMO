server {
  host = "0.0.0.0"
  port = 2106
  checksumSize = 16
  rootKeyResource = "game.private.pem"
  rootKey = ${?OPENMMO_GAME_PRIVATE_KEY}
  rootKeyFile = ${?OPENMMO_GAME_PRIVATE_KEY_FILE}
  sessionSecret = "dev-only-secret-do-not-use-in-production"
  sessionSecret = ${?OPENMMO_SESSION_SECRET}
  # Idle window for a remember me token. Every token login issues a fresh one.
  rememberMeMaxAge = 30d
  rememberMeMaxAge = ${?OPENMMO_REMEMBER_ME_MAX_AGE}
  # Creates this account when both are set and the database holds no user at all. Never resets
  # an existing password, so changing these later does nothing.
  admin {
    username = ${?OPENMMO_ADMIN_USERNAME}
    password = ${?OPENMMO_ADMIN_PASSWORD}
  }
}

gameServer {
  ipv4Address = "127.0.0.1"
  ipv4Address = ${?GAME_SERVER_PUBLIC_IPV4}
  ipv6Address = "::1"
  ipv6Address = ${?GAME_SERVER_PUBLIC_IPV6}
  port = 7777
  port = ${?GAME_SERVER_PORT}
  # Loopback in every retail capture, whatever the addresses above are. Not what a client dials.
  localAddress = "127.0.0.1"
  localAddress = ${?GAME_SERVER_LOCAL_ADDRESS}
  localHostname = "localhost"
  localHostname = ${?GAME_SERVER_LOCAL_HOSTNAME}
}

db {
  host = "localhost"
  host = ${?LOGIN_DB_HOST}
  port = 20011
  port = ${?LOGIN_DB_PORT}
  name = "openmmo_login_db"
  name = ${?LOGIN_DB_NAME}
  user = "openmmo_login_user"
  user = ${?LOGIN_DB_USER}
  password = "changeMe!"
  password = ${?LOGIN_DB_PASSWORD}
  poolSize = 4
  poolSize = ${?LOGIN_DB_POOL_SIZE}
  # Applies the dev seed data in db/dev, including the admin account. The gradle run task turns
  # this on, so a plain launch of a built distribution never seeds.
  seedDev = false
  seedDev = ${?LOGIN_DB_SEED_DEV}
}
