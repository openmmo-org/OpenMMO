name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT is needed for CI to run on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish server distributions and images
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distributions
        run: >
          ./gradlew :server.login:assembleDist :server.game:assembleDist
          :server.login:installDist :server.game:installDist

      - name: Check no keys are bundled
        run: bash .github/scripts/check-no-keys.sh

      # Before the images, so a registry failure cannot leave a tagged release with no archives.
      - name: Attach distributions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            server.login/build/distributions/* \
            server.game/build/distributions/* \
            --clobber

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the login server image
        id: login-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmmo-login
          flavor: latest=true
          labels: org.opencontainers.image.title=OpenMMO login server
          annotations: org.opencontainers.image.title=OpenMMO login server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}

      - name: Publish the login server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server.login/Dockerfile
          push: true
          tags: ${{ steps.login-image.outputs.tags }}
          labels: ${{ steps.login-image.outputs.labels }}
          annotations: ${{ steps.login-image.outputs.annotations }}

      - name: Describe the game server image
        id: game-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmmo-game
          flavor: latest=true
          labels: org.opencontainers.image.title=OpenMMO game server
          annotations: org.opencontainers.image.title=OpenMMO game server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}

      - name: Publish the game server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server.game/Dockerfile
          push: true
          tags: ${{ steps.game-image.outputs.tags }}
          labels: ${{ steps.game-image.outputs.labels }}
          annotations: ${{ steps.game-image.outputs.annotations }}
