name: Dev images

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

# Only the newest master is worth an image, so supersede a run still in flight.
concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish dev server images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distributions
        run: ./gradlew :server.login:installDist :server.game:installDist

      - name: Check no keys are bundled
        run: bash .github/scripts/check-no-keys.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the login server image
        id: login-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmmo-login
          flavor: latest=false
          labels: org.opencontainers.image.title=OpenMMO login server
          annotations: org.opencontainers.image.title=OpenMMO login server
          tags: |
            type=raw,value=dev
            type=sha,format=short

      - name: Publish the login server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server.login/Dockerfile
          push: true
          tags: ${{ steps.login-image.outputs.tags }}
          labels: ${{ steps.login-image.outputs.labels }}
          annotations: ${{ steps.login-image.outputs.annotations }}

      - name: Describe the game server image
        id: game-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmmo-game
          flavor: latest=false
          labels: org.opencontainers.image.title=OpenMMO game server
          annotations: org.opencontainers.image.title=OpenMMO game server
          tags: |
            type=raw,value=dev
            type=sha,format=short

      - name: Publish the game server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server.game/Dockerfile
          push: true
          tags: ${{ steps.game-image.outputs.tags }}
          labels: ${{ steps.game-image.outputs.labels }}
          annotations: ${{ steps.game-image.outputs.annotations }}
