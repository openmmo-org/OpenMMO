platforms = ["macos/arm64"]
signature = "E1 4B 40 F9 E0 63 40 F9 E0 63 00 F9 E4 03 00 AA E2 37 40 F9 E3 3F 40 F9 ?? ?? ?? 94 00 8D 00 34"
