revision = 32898
feed_redirect = "manifest"
login_redirect = "feed"

# Revision 32898 no longer carries a fallback login hostname. It reads the endpoint from the
# signed main feed, so login_redirect deliberately adds no binary-string patch.

# This native image opens update-feed URLs without consulting Java's proxy selector. Redirect only
# IPv6-mapped HTTPS sockets to the fixed loopback feed port; login and game sockets keep their
# original address and port.
[[patches]]
type = "binary_signature"
name = "EnterDevelopmentFeedRedirectMacosArm64"
target = "@client"
platforms = ["macos/arm64"]
signature = "E4 33 00 91 E2 03 05 AA E5 03 08 AA ?? ?? ?? 94 C0 00 00 34 80 00 80 12"
offset = 16
replace = "1B 00 00 14"

[[patches]]
type = "binary_signature"
name = "PreserveDevelopmentFeedConnectErrorsMacosArm64"
target = "@client"
platforms = ["macos/arm64"]
signature = "08 00 40 B9 1F 91 00 71 61 01 00 54 20 00 80 12"
offset = 8
replace = "01 00 00 14"

[[patches]]
type = "binary_signature"
name = "DevelopmentFeedRedirectMacosArm64"
target = "@client"
platforms = ["macos/arm64"]
signature = "2D 64 00 94 08 00 40 B9 1F 11 00 71 C1 00 00 54 40 00 80 12 FD 7B 44 A9 F4 4F 43 A9 FF 43 01 91 C0 03 5F D6 24 64 00 94 01 00 40 B9 E0 03 13 AA 02 00 80 D2 C7 FE FF 97 FD 7B 44 A9"
replace = "E0 03 13 AA E1 03 14 AA C2 FC FF 97 E8 4F 40 39 1F ED 02 71 C1 00 00 54 E8 69 9B 52 E8 27 00 79 E8 0F 80 52 08 20 A0 72 E8 27 00 B9 E2 0F 40 B9 E1 43 00 91 44 64 00 94 E3 FF FF 17"

# Supplying a runtime trust store activates this build's rejecting trust manager. HTTPS sockets are
# already constrained to the loopback feed above, so accept its ephemeral certificate and let the
# feed's signature checks authenticate the response.
[[patches]]
type = "binary_signature"
name = "DevelopmentFeedCertificateMacosArm64"
target = "@client"
platforms = ["macos/arm64"]
signature = "E0 03 1E AA E6 03 01 AA E7 03 02 AA FE 03 04 AA E6 1F 02 A9 C0 03 3F D6 E0 1B 40 F9"
offset = 20
replace = "1F 20 03 D5"

[[patches]]
